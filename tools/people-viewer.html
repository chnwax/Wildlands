<!doctype html>
<html><head><meta charset="utf-8"><title>People bake viewer</title>
<style>html,body{margin:0;background:#9fb4c8;overflow:hidden;font:12px system-ui}#info{position:fixed;left:8px;top:6px;color:#123}</style>
<script type="importmap">{ "imports": { "three": "../lib/three/build/three.module.js" } }</script></head>
<body><div id="info"></div>
<script type="module">
// Shows the baked crowd models (assets/models/people, tools/people-bake.mjs): every model in a row, one column per clip
// (?f=0..1: the moment of each clip shown; ?clip=sit: one clip, six moments of it; ?side: from the side). Positions are read on the CPU straight from the baked frames.
import * as THREE from 'three';
const q = new URLSearchParams(location.search), at = +(q.get('f') ?? 0.3);
const meta = await (await fetch('../assets/models/people/people.json')).json(), bin = await (await fetch('../assets/models/people/people.bin')).arrayBuffer();
const R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(innerWidth, innerHeight); document.body.append(R.domElement);
const S = new THREE.Scene(), C = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
S.add(new THREE.HemisphereLight(0xffffff, 0x556644, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(3, 6, 8); S.add(sun);
const half = h => { const s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 31, m = h & 1023; return e === 0 ? s * m * 2 ** -24 : e === 31 ? s * Infinity : s * (1 + m / 1024) * 2 ** (e - 15); };
const CL = ['walk', 'idle', 'sit', 'run', 'act', 'talk'];
meta.models.forEach((M, row) => {
  const idx = M.idx32 ? new Uint32Array(bin, M.idx, M.ni) : new Uint16Array(bin, M.idx, M.ni), col = new Float32Array(bin, M.col, M.nv * 3), pos = new Uint16Array(bin, M.pos, M.nv * M.frames * 4);
  const cols = q.get('clip') ? [0, 0.2, 0.4, 0.6, 0.8, 0.99].map(t => [q.get('clip'), t]) : CL.map(c => [c, at]);
  cols.forEach(([c, tt], k) => {
    const cl = M.clips[c]; if (!cl) return;
    const f = cl.f0 + Math.min(cl.n - 1, Math.floor(tt * cl.n)), P = new Float32Array(M.nv * 3);
    for (let i = 0; i < M.nv; i++) for (let j = 0; j < 3; j++) P[i * 3 + j] = half(pos[(f * M.nv + i) * 4 + j]);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(P, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setIndex(new THREE.BufferAttribute(idx, 1));
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.8 }));
    m.position.set((k - 2.5) * 1.6, 0, -row * 2.2); S.add(m);
  });
});
const n = meta.models.length, row = +(q.get('row') ?? -1);
if (row >= 0) { C.position.set(1.5, 1.3, -row * 2.2 + 9); C.lookAt(0, 0.7, -row * 2.2); } // (?row=k: model k's row up close)
else { C.position.set(q.has('side') ? 18 : 0, 3 + n * 0.6, q.has('side') ? -n : 9); C.lookAt(0, 0.8, -(n - 1) * 1.1); }
if (q.has('side')) for (const o of S.children) if (o.isMesh) o.rotation.y = Math.PI / 2;
R.render(S, C);
document.getElementById('info').textContent = meta.models.map(M => M.id + ' ' + M.nv + 'v').join(' · ') + '  | columns: ' + CL.join(' ');
window.__done = true;
</script></body></html>
